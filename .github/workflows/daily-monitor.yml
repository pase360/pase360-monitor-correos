name: Pase 360 - Monitor diario de correos

on:
  workflow_dispatch:
    inputs:
      report_period:
        description: "Qué día consultar"
        required: true
        type: choice
        options:
          - today
          - yesterday
        default: today
  schedule:
    # 04:00 Argentina (UTC-3). Se programa con margen por posibles demoras de GitHub.
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: pase360-monitor-correos
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar Odoo y enviar informe
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TIMEZONE: America/Argentina/Cordoba
          REPORT_PERIOD: ${{ inputs.report_period || 'yesterday' }}
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
        run: python monitor.py
